<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePixel Provenance Verifier</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; max-width: 600px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 1.4rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; }
        button { width: 100%; padding: 12px; background-color: #0284c7; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .result-box { margin-top: 20px; padding: 16px; border-radius: 8px; display: none; }
        .valid { background-color: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #34d399; }
        .invalid { background-color: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
        .meta-info { font-size: 0.85rem; color: #94a3b8; margin-top: 8px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <h1>SecurePixel Authenticity Verifier</h1>
    
    <div class="input-group">
        <label for="seedInput">Master Seed (Timestamp):</label>
        <input type="text" id="seedInput" placeholder="Contoh: 1725166800000">
    </div>

    <div class="input-group">
        <label for="imageInput">Pilih Foto (Original atau WhatsApp):</label>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp">
    </div>

    <button onclick="verifyImage()">Verifikasi Keaslian</button>

    <div id="resultBox" class="result-box">
        <div id="resultTitle" style="font-weight: bold; font-size: 1.1rem;"></div>
        <div id="resultMeta" class="meta-info"></div>
    </div>
</div>

<canvas id="canvas" style="display: none;"></canvas>

<script>
    const SCATTER_RATIO = 0.06;

    // Matriks DCT 8x8
    const C = Array.from({length: 8}, () => new Float64Array(8));
    const CT = Array.from({length: 8}, () => new Float64Array(8));
    const invSqrt2 = 1.0 / Math.sqrt(2.0);

    for (let j = 0; j < 8; j++) {
        C[0][j] = 0.5 * invSqrt2;
        CT[j][0] = C[0][j];
    }
    for (let i = 1; i < 8; i++) {
        for (let j = 0; j < 8; j++) {
            C[i][j] = 0.5 * Math.cos(((2 * j + 1) * i * Math.PI) / 16.0);
            CT[j][i] = C[i][j];
        }
    }

    function createPRNG(seed) {
        let state = Number(BigInt(seed) % 2147483647n);
        if (state <= 0) state += 2147483646;
        return function() {
            state = Number((BigInt(state) * 16807n) % 2147483647n);
            return (state - 1) / 2147483646;
        };
    }

    function deriveSubSeed(masterSeed, key) {
        const str = `${masterSeed}_${key}`;
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            hash = (31 * hash + str.charCodeAt(i)) | 0;
        }
        return Math.abs(hash);
    }

    function fastForwardDCT(block, out) {
        const temp = new Float64Array(64);
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                let sum = 0.0;
                for (let k = 0; k < 8; k++) sum += C[i][k] * block[k * 8 + j];
                temp[i * 8 + j] = sum;
            }
        }
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                let sum = 0.0;
                for (let k = 0; k < 8; k++) sum += temp[i * 8 + k] * CT[k][j];
                out[i * 8 + j] = sum;
            }
        }
    }

    // Ekstraksi nilai Luma (Y) langsung dari pixel mentah
    function getLumaAt(data, width, height, x, y) {
        const px = Math.max(0, Math.min(width - 1, Math.floor(x)));
        const py = Math.max(0, Math.min(height - 1, Math.floor(y)));
        const idx = (py * width + px) * 4;
        return 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
    }

    function auditImage(data, width, height, targetW, targetH, seedVal, isDownscaled) {
        const subSeed = deriveSubSeed(seedVal, "PHOTO_DCT");
        const rng = createPRNG(subSeed);

        let totalAudited = 0;
        let matchedBits = 0;

        const blockY = new Float64Array(64);
        const dct = new Float64Array(64);

        const scaleX = width / targetW;
        const scaleY = height / targetH;

        for (let by = 0; by < targetH; by += 8) {
            for (let bx = 0; bx < targetW; bx += 8) {
                const isSelected = rng() <= SCATTER_RATIO;

                let blockSumY = 0.0;

                if (!isDownscaled) {
                    // Jalur Cepat 1:1 untuk Foto Asli
                    for (let y = 0; y < 8; y++) {
                        const rowIdx = ((by + y) * width + bx) * 4;
                        for (let x = 0; x < 8; x++) {
                            const p = rowIdx + (x * 4);
                            const yVal = 0.299 * data[p] + 0.587 * data[p + 1] + 0.114 * data[p + 2];
                            blockSumY += yVal;
                            blockY[y * 8 + x] = yVal - 128.0;
                        }
                    }
                } else {
                    // Jalur Rekonstruksi Area untuk Gambar Terkompresi
                    for (let y = 0; y < 8; y++) {
                        const sampleY = (by + y + 0.5) * scaleY;
                        for (let x = 0; x < 8; x++) {
                            const sampleX = (bx + x + 0.5) * scaleX;
                            const yVal = getLumaAt(data, width, height, sampleX, sampleY);
                            blockSumY += yVal;
                            blockY[y * 8 + x] = yVal - 128.0;
                        }
                    }
                }

                const expectedBit1 = rng() > 0.5 ? 1 : 0;
                const expectedBit2 = rng() > 0.5 ? 1 : 0;

                if (!isSelected) continue;

                const avgLuma = blockSumY / 64.0;
                if (avgLuma < 25.0 || avgLuma > 230.0) continue;

                fastForwardDCT(blockY, dct);

                // Evaluasi Pair 1: (2,1) vs (1,2)
                const bit1 = dct[2 * 8 + 1] > dct[1 * 8 + 2] ? 1 : 0;
                if (bit1 === expectedBit1) matchedBits++;
                totalAudited++;

                // Evaluasi Pair 2: (3,0) vs (0,3)
                const bit2 = dct[3 * 8 + 0] > dct[0 * 8 + 3] ? 1 : 0;
                if (bit2 === expectedBit2) matchedBits++;
                totalAudited++;
            }
        }

        return {
            matchRate: totalAudited > 0 ? (matchedBits / totalAudited) * 100 : 0,
            totalAudited,
            matchedBits
        };
    }

    function verifyImage() {
        const seedVal = document.getElementById('seedInput').value.trim();
        const fileInput = document.getElementById('imageInput');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultMeta = document.getElementById('resultMeta');

        if (!seedVal || !fileInput.files[0]) {
            alert('Harap masukkan Master Seed dan pilih file gambar!');
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const nw = img.naturalWidth;
                const nh = img.naturalHeight;

                const canvas = document.getElementById('canvas');
                const ctx = canvas.getContext('2d', { willReadFrequently: true });

                canvas.width = nw;
                canvas.height = nh;
                ctx.drawImage(img, 0, 0, nw, nh);

                const imgData = ctx.getImageData(0, 0, nw, nh);
                const rawData = imgData.data;

                // 1. Coba verifikasi native 1:1 langsung
                const targetW = nw - (nw % 16);
                const targetH = nh - (nh % 16);
                let res = auditImage(rawData, nw, nh, targetW, targetH, seedVal, false);
                let mode = `Native Capture (${nw}x${nh})`;

                // 2. Jika match rate rendah (indikasi downscaled WA), uji dengan grid kanonikal 4:3
                if (res.matchRate < 70.0) {
                    const isPortrait = nh > nw;
                    const canW = isPortrait ? 1920 : 2560;
                    const canH = isPortrait ? 2560 : 1920;

                    const resCompressed = auditImage(rawData, nw, nh, canW, canH, seedVal, true);
                    if (resCompressed.matchRate > res.matchRate) {
                        res = resCompressed;
                        mode = `Compressed/WhatsApp (${nw}x${nh} &rarr; Grid ${canW}x${canH})`;
                    }
                }

                resultBox.style.display = 'block';

                const threshold = 65.0; // Ambang batas toleransi re-encoding lossy
                if (res.matchRate >= threshold) {
                    resultBox.className = "result-box valid";
                    resultTitle.innerHTML = `🟢 AUTHENTIC / VERIFIED (${res.matchRate.toFixed(2)}%)`;
                } else {
                    resultBox.className = "result-box invalid";
                    resultTitle.innerHTML = `🔴 TAMPERED / FORGED (${res.matchRate.toFixed(2)}%)`;
                }

                resultMeta.innerHTML = `
                    <b>Mode Deteksi:</b> ${mode}<br>
                    <b>Total Bit Diaudit:</b> ${res.totalAudited.toLocaleString()} bit<br>
                    <b>Bit Cocok:</b> ${res.matchedBits.toLocaleString()} bit<br>
                    <b>Ambang Batas Keaslian:</b> &ge; ${threshold.toFixed(2)}% (Baseline Acak = 50.00%)
                `;
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
