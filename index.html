<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurePixel - JPEG DCT Forensic Auditor & Notary</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div class="w-full max-w-2xl space-y-6">
    <header class="text-center space-y-2 border-b border-slate-800 pb-5">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-950 border border-cyan-500/30 text-cyan-400 text-xs font-semibold uppercase tracking-wider">
        <span>●</span> Deterministic JPEG DCT Forensic Verifier
      </div>
      <h1 class="text-3xl font-extrabold text-white">SecurePixel JPEG Verifier</h1>
      <p class="text-slate-400 text-xs max-w-lg mx-auto">
        Verify hardware provenance seals on JPEG photos. Mathematical audit works 100% offline, with optional Supabase notary anchoring.
      </p>
    </header>

    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl space-y-5">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Select JPEG Photo (.jpg):</label>
          <input type="file" id="auditFileInput" accept="image/jpeg,image/jpg" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700 cursor-pointer border border-slate-700 rounded-lg p-1 bg-slate-950" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Target Master Seed (Timestamp):</label>
          <input type="number" id="auditSeedInput" placeholder="Auto-extracted from filename or enter manually" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500 font-mono" />
        </div>

        <button id="btnAudit" class="w-full py-3 px-4 bg-cyan-500 hover:bg-cyan-400 font-bold text-xs tracking-wider uppercase text-slate-950 rounded-lg transition-all cursor-pointer">
          🔍 Execute Offline Forensic Audit
        </button>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-lg p-5 min-h-[140px] flex flex-col justify-center items-center">
        <div id="auditResultBox" class="text-xs text-slate-500 text-center w-full">
          Select a photo and click audit to view mathematical correlation results.
        </div>
      </div>

      <div id="anchorSection" class="hidden border-t border-slate-800 pt-4 space-y-2">
        <button id="btnAnchor" class="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold text-xs text-cyan-400 rounded-lg transition-all cursor-pointer">
          ⚡ Anchor this Master Seed to Supabase Global Notary
        </button>
        <div id="anchorStatus" class="text-[11px] text-center font-mono text-slate-400"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mxswcmykijdnjnahhyqr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14c3djbXlraWpkbmpuYWhoeXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NTc3NTcsImV4cCI6MjEwMDUzMzc1N30.YpofSN8iYaFYhfELXGYySGjYXr0TmiAeJVyeNCzgF7Q';

    const ZIGZAG_MID = [
      [3,0], [2,1], [1,2], [0,3],
      [0,4], [1,3], [2,2], [3,1], [4,0],
      [5,0], [4,1], [3,2], [2,3], [1,4], [0,5]
    ];
    const SCATTER_RATIO = 0.15;

    function createPRNG(seed) {
      let state = seed % 2147483647;
      if (state <= 0) state += 2147483646;
      return function() {
        state = (state * 16807) % 2147483647;
        return (state - 1) / 2147483646;
      };
    }

    function deriveSubSeed(masterSeed, key) {
      let str = masterSeed + "_" + key;
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (Math.imul(31, hash) + str.charCodeAt(i)) | 0;
      }
      return Math.abs(hash);
    }

    function forwardDCT8x8(block) {
      let dct = Array.from({length: 8}, () => new Float64Array(8));
      for (let u = 0; u < 8; u++) {
        for (let v = 0; v < 8; v++) {
          let sum = 0.0;
          let cu = (u === 0) ? (1 / Math.sqrt(2)) : 1.0;
          let cv = (v === 0) ? (1 / Math.sqrt(2)) : 1.0;
          for (let x = 0; x < 8; x++) {
            for (let y = 0; y < 8; y++) {
              sum += block[x][y] * Math.cos(((2 * x + 1) * u * Math.PI) / 16) * Math.cos(((2 * y + 1) * v * Math.PI) / 16);
            }
          }
          dct[u][v] = 0.25 * cu * cv * sum;
        }
      }
      return dct;
    }

    async function checkSeedInSupabase(seed) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/seeds?master_seed=eq.${seed}&select=*`, {
          method: 'GET',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        if (!response.ok) return false;
        const data = await response.json();
        return data.length > 0;
      } catch (err) {
        return false;
      }
    }

    async function uploadSeedToSupabase(seed) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/seeds`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            photo_id: "IMG_" + seed,
            master_seed: seed,
            width: 1080,
            height: 1920,
            scatter_count: 1200
          })
        });
        return response.ok;
      } catch (err) {
        return false;
      }
    }

    let auditImg = null;
    let verifiedSeed = null;

    const auditInput = document.getElementById('auditFileInput');
    const auditSeedInput = document.getElementById('auditSeedInput');
    const btnAudit = document.getElementById('btnAudit');
    const auditResultBox = document.getElementById('auditResultBox');
    const anchorSection = document.getElementById('anchorSection');
    const btnAnchor = document.getElementById('btnAnchor');
    const anchorStatus = document.getElementById('anchorStatus');

    auditInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const match = file.name.match(/\d{12,14}/);
      if (match) {
        auditSeedInput.value = match[0];
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        auditImg = new Image();
        auditImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    btnAudit.addEventListener('click', async function() {
      if (!auditImg) {
        alert("Please select a JPEG image first!");
        return;
      }
      if (!auditSeedInput.value) {
        alert("Please enter the Master Seed!");
        return;
      }

      const inputSeed = parseInt(auditSeedInput.value.trim());
      const tempCanvas = document.createElement('canvas');
      const ctx = tempCanvas.getContext('2d');
      const w = auditImg.width - (auditImg.width % 8);
      const h = auditImg.height - (auditImg.height % 8);
      tempCanvas.width = w;
      tempCanvas.height = h;
      ctx.drawImage(auditImg, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const subSeed = deriveSubSeed(inputSeed, "PHOTO_DCT");
      const rng = createPRNG(subSeed);

      let totalTested = 0;
      let matchedCorrelation = 0;

      for (let by = 0; by < h; by += 8) {
        for (let bx = 0; bx < w; bx += 8) {
          if (rng() > SCATTER_RATIO) continue;

          let blockY = Array.from({length: 8}, () => new Float64Array(8));
          for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
              let idx = ((by + y) * w + (bx + x)) * 4;
              blockY[x][y] = (0.299 * data[idx] + 0.587 * data[idx+1] + 0.114 * data[idx+2]) - 128;
            }
          }

          let dct = forwardDCT8x8(blockY);

          for (let i = 0; i < ZIGZAG_MID.length; i++) {
            let pos = ZIGZAG_MID[i];
            let expectedSign = rng() > 0.5 ? 1 : -1;
            let actualVal = dct[pos[0]][pos[1]];

            if ((actualVal >= 0 && expectedSign === 1) || (actualVal < 0 && expectedSign === -1)) {
              matchedCorrelation++;
            }
            totalTested++;
          }
        }
      }

      const matchRate = (matchedCorrelation / totalTested) * 100;
      const isAuthentic = matchRate >= 60.5;
      const isAnchoredInDB = await checkSeedInSupabase(inputSeed);

      verifiedSeed = inputSeed;

      if (isAuthentic) {
        anchorSection.classList.remove('hidden');
        auditResultBox.innerHTML = `
          <div class="p-4 bg-emerald-950/40 border border-emerald-500 rounded-lg text-left space-y-1.5">
            <div class="text-emerald-400 font-bold text-sm">🟢 AUTHENTIC HARDWARE PROVENANCE</div>
            <div class="text-white text-xs font-mono">Response Correlation: <strong>${matchRate.toFixed(2)}%</strong> (Threshold: >60.50%)</div>
            <div class="text-emerald-300 text-[11px] font-mono">Supabase Notary: <strong>${isAnchoredInDB ? "ANCHORED IN PUBLIC REGISTRY" : "LOCAL ONLY (NOT YET ANCHORED)"}</strong></div>
            <p class="text-[11px] text-slate-400 mt-1">Mid-frequency DCT signature matches the deterministic Master Seed. Genuine hardware sensor capture.</p>
          </div>
        `;
      } else {
        anchorSection.classList.add('hidden');
        auditResultBox.innerHTML = `
          <div class="p-4 bg-rose-950/40 border border-rose-500 rounded-lg text-left space-y-1.5">
            <div class="text-rose-400 font-bold text-sm">🔴 TAMPERED / SEED MISMATCH</div>
            <div class="text-white text-xs font-mono">Response Correlation: <strong>${matchRate.toFixed(2)}%</strong> (Baseline Noise: ~50.00%)</div>
            <p class="text-[11px] text-slate-400 mt-1">No cryptographic correlation detected. The file has been modified, generated by AI, or paired with an incorrect Master Seed.</p>
          </div>
        `;
      }
    });

    btnAnchor.addEventListener('click', async function() {
      if (!verifiedSeed) return;
      anchorStatus.innerText = "Anchoring to Supabase...";
      const ok = await uploadSeedToSupabase(verifiedSeed);
      if (ok) {
        anchorStatus.innerText = "🟢 Successfully anchored to Supabase Notary database!";
        anchorStatus.classList.remove("text-rose-400");
        anchorStatus.classList.add("text-emerald-400");
      } else {
        anchorStatus.innerText = "⚠️ Failed to anchor (Check connection / RLS).";
        anchorStatus.classList.remove("text-emerald-400");
        anchorStatus.classList.add("text-rose-400");
      }
    });
  </script>
</body>
</html>
